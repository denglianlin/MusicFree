name: iOS (unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install CocoaPods dependencies
        # 关键：关掉 New Architecture，走老桥（legacy bridge）。
        # react-native-track-player v4 不支持 TurboModule，
        # 新架构下启动时 ObjCInteropTurboModule 构造即空指针闪退。
        # Expo SDK 52 / RN 0.76.5 仍支持老桥（SDK 55 / RN 0.82 起才强制新架构）。
        env:
          RCT_NEW_ARCH_ENABLED: '0'
        run: |
          cd ios
          bundle install
          bundle exec pod install

      - name: Build unsigned app
        run: |
          xcodebuild -workspace ios/MusicFree.xcworkspace \
            -scheme MusicFreeNew \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "App: $APP_PATH"
          test -d "$APP_PATH" || exit 1
          rm -rf Payload MusicFree-unsigned.ipa
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r MusicFree-unsigned.ipa Payload
          ls -lh MusicFree-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicFree-ios-unsigned
          path: MusicFree-unsigned.ipa
          retention-days: 30
